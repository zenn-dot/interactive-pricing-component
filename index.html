<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Interactive pricing component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>


<h1>Simple, traffic-based pricing</h1>
<h2>Sign-up for our 30-day trial. No credit card required.</h2>

<div id="card">
  <p id="views">100K PAGEVIEWS</p>
  <h3 id="price">$16.00 / month</h3>



  <div id="billing">
    <span>Monthly Billing</span>
    <input type="checkbox" id="toggle">
    <span>Yearly Billing (25% discount)</span>
  </div>

  <p>Unlimited websites</p>
  <p>100% data ownership</p>
  <p>Email reports</p>

  <button>Start my trial</button>
</div>

<script>
let body = document.querySelector('body');
let card = document.querySelector('#card');
let btn = document.querySelector('button');
let slider = document.querySelector('#slider');
let toggle = document.querySelector('#toggle');
let price = document.querySelector('#price');
let views = document.querySelector('#views');


body.style.background = "#f1f5fe";
body.style.fontFamily = "Arial";
body.style.display = "flex";
body.style.flexDirection = "column";
body.style.alignItems = "center";
body.style.justifyContent = "center";
body.style.height = "100vh";
body.style.margin = "0";


card.style.background = "white";
card.style.padding = "25px";
card.style.borderRadius = "15px";
card.style.boxShadow = "0 10px 30px rgba(0,0,0,0.1)";
card.style.textAlign = "center";
card.style.width = "320px";

btn.style.background = "#293356";
btn.style.color = "white";
btn.style.border = "none";
btn.style.padding = "10px 20px";
btn.style.borderRadius = "8px";
btn.style.cursor = "pointer";


views.style.letterSpacing = "2px";
views.style.fontSize = "12px";
views.style.color = "gray";

price.style.fontSize = "28px";
price.style.margin = "15px 0";
</script>

 
</body>
</html>
